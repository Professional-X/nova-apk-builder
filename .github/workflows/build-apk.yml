name: Build APK
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "GitHub Release ID for output"
        required: true
        type: string
      blob_sha:
        description: "Git blob SHA containing the source ZIP"
        required: true
        type: string
      signing_mode:
        description: "Signing mode: generate or existing"
        required: true
        type: string
        default: generate

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ──────────────────────────────────────────────
      # 1. DOWNLOAD SOURCE
      # ──────────────────────────────────────────────
      - name: Download source ZIP
        run: |
          BLOB_SHA="${{ inputs.blob_sha }}"
          if command -v gh &>/dev/null; then
            if gh api "repos/${{ github.repository }}/git/blobs/$BLOB_SHA" \
              -H "Accept: application/vnd.github.v3.raw" > source.zip 2>&1; then
              echo "OK via gh"
            else
              rm -f source.zip
            fi
          fi
          if [ ! -s source.zip ]; then
            curl -sfL -o source.zip \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" || true
          fi
          if [ ! -s source.zip ]; then
            curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" | \
              jq -r .content | base64 -d > source.zip
          fi
          if [ ! -s source.zip ] || ! file source.zip | grep -q "Zip archive"; then
            echo "ERROR: Could not download valid ZIP"
            exit 1
          fi
          echo "ZIP: $(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip) bytes"

      # ──────────────────────────────────────────────
      # 2. EXTRACT + DETECT PROJECT + VERSIONS
      # ──────────────────────────────────────────────
      - name: Extract and analyze project
        id: info
        shell: bash
        run: |
          set +e
          mkdir -p workspace && cd workspace && unzip -o ../source.zip && cd ..
          cd workspace
          ROOT="" && TYPE=""
          is_flutter() { [ -f "$1/pubspec.yaml" ] && grep -q "flutter:" "$1/pubspec.yaml" 2>/dev/null; }
          is_android() { [ -f "$1/settings.gradle" ] || [ -f "$1/settings.gradle.kts" ] || ([ -f "$1/build.gradle" ] && [ -d "$1/app" ]); }
          for search in "." "*/" "*/*/"; do
            for d in $search; do
              [ -d "$d" ] || continue; d="${d%/}"
              if [ -z "$ROOT" ]; then
                if is_flutter "$d"; then ROOT="$d"; TYPE="flutter"
                elif is_android "$d"; then ROOT="$d"; TYPE="android"; fi
              fi
            done
          done
          if [ -z "$ROOT" ]; then
            echo "ERROR: No Android/Flutter project found"
            find . -maxdepth 4 -type f | head -30
            exit 1
          fi
          echo "ROOT=$ROOT" >> $GITHUB_OUTPUT
          echo "TYPE=$TYPE" >> $GITHUB_OUTPUT
          echo "Project: $TYPE at $ROOT"
          # ── Detect AGP version (try multiple sources) ──
          AGP=""
          GRADLE_FILES=$(find "$ROOT" -maxdepth 3 \( -name "*.gradle" -o -name "*.gradle.kts" \) 2>/dev/null | head -20)
          for F in $GRADLE_FILES; do
            V=$(grep -oP 'com\.android\.tools\.build:gradle:\K[\d]+\.[\d]+(\.[\d]+)?' "$F" 2>/dev/null | head -1)
            [ -n "$V" ] && AGP="$V" && break
          done
          if [ -z "$AGP" ]; then
            SETTINGS_FILES=$(find "$ROOT" -maxdepth 2 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) 2>/dev/null | head -5)
            for F in $SETTINGS_FILES; do
              V=$(grep "com.android.application" "$F" 2>/dev/null | grep -oP '[\d]+\.[\d]+(\.[\d]+)?' | head -1)
              [ -n "$V" ] && AGP="$V" && break
            done
          fi
          if [ -z "$AGP" ]; then
            TOML_FILES=$(find "$ROOT" -maxdepth 3 -name "libs.versions.toml" 2>/dev/null | head -5)
            for F in $TOML_FILES; do
              V=$(grep -oP '^agp\s*=\s*"\K[\d]+\.[\d]+(\.[\d]+)?' "$F" 2>/dev/null | head -1)
              [ -z "$V" ] && V=$(grep -oP '^android-gradle-plugin\s*=\s*"\K[\d]+\.[\d]+(\.[\d]+)?' "$F" 2>/dev/null | head -1)
              [ -z "$V" ] && V=$(grep -A1 'com.android.application' "$F" 2>/dev/null | grep -oP '[\d]+\.[\d]+(\.[\d]+)?' | head -1)
              [ -z "$V" ] && V=$(grep -oP 'agp\s*=\s*"\K[\d]+\.[\d]+(\.[\d]+)?' "$F" 2>/dev/null | head -1)
              [ -n "$V" ] && AGP="$V" && break
            done
          fi
          echo "AGP: ${AGP:-unknown}"
          # ── Pick Java version based on AGP ──
          JAVA="17"
          if [ -n "$AGP" ]; then
            MAJOR=$(echo "$AGP" | cut -d. -f1)
            if [ "$MAJOR" -ge 9 ] 2>/dev/null; then JAVA="21"
            elif [ "$MAJOR" -lt 8 ] 2>/dev/null; then JAVA="11"; fi
          fi
          if [ "$TYPE" = "flutter" ]; then JAVA="17"; fi
          echo "JAVA=$JAVA" >> $GITHUB_OUTPUT
          echo "AGP=$AGP" >> $GITHUB_OUTPUT
          echo "Java: $JAVA"
          # ── Detect compileSdk, buildTools, NDK from gradle files ──
          COMPILE_SDKS=""
          BUILD_TOOLS=""
          NDK_VERS=""
          ALL_GRADLE=$(find "$ROOT" -maxdepth 4 \( -name "*.gradle" -o -name "*.gradle.kts" \) 2>/dev/null | head -30)
          for F in $ALL_GRADLE; do
            # Standard compileSdk syntax: compileSdk = 34 or compileSdk 34
            CS=$(grep -oP '(?:compileSdk|compileSdkVersion)\s*=?\s*["\x27]?\K\d+' "$F" 2>/dev/null || true)
            # AGP 9.x block syntax: compileSdk { version = release(36) ... } or compileSdk { version = preview("36") }
            if [ -z "$CS" ]; then
              CS=$(grep -oP 'compileSdk\s*\{[^}]*release\(\K\d+' "$F" 2>/dev/null || true)
            fi
            if [ -z "$CS" ]; then
              CS=$(grep -oP 'compileSdk\s*\{[^}]*preview\("\K\d+' "$F" 2>/dev/null || true)
            fi
            COMPILE_SDKS="$COMPILE_SDKS $CS"
            BT=$(grep -oP 'buildToolsVersion\s*=?\s*["\x27]\K[\d.]+' "$F" 2>/dev/null || true)
            BUILD_TOOLS="$BUILD_TOOLS $BT"
            NK=$(grep -oP 'ndkVersion\s*=?\s*["\x27]\K[\d.]+' "$F" 2>/dev/null || true)
            NDK_VERS="$NDK_VERS $NK"
          done
          # Also check gradle.properties for COMPILE_SDK
          PROP_FILES=$(find "$ROOT" -maxdepth 2 -name "gradle.properties" 2>/dev/null | head -5)
          for F in $PROP_FILES; do
            CS=$(grep -oP 'COMPILE_SDK\s*=?\s*\K\d+' "$F" 2>/dev/null || true)
            COMPILE_SDKS="$COMPILE_SDKS $CS"
          done
          COMPILE_SDKS=$(echo $COMPILE_SDKS | tr ' ' $'\n' | sort -u | grep -v '^$' | tr $'\n' ' ' || true)
          BUILD_TOOLS=$(echo $BUILD_TOOLS | tr ' ' $'\n' | sort -u | grep -v '^$' | tr $'\n' ' ' || true)
          NDK_VERS=$(echo $NDK_VERS | tr ' ' $'\n' | sort -u | grep -v '^$' | tr $'\n' ' ' || true)
          echo "SDK=$COMPILE_SDKS" >> $GITHUB_OUTPUT
          echo "BT=$BUILD_TOOLS" >> $GITHUB_OUTPUT
          echo "NDK=$NDK_VERS" >> $GITHUB_OUTPUT
          echo "compileSdk: $COMPILE_SDKS"
          echo "buildTools: $BUILD_TOOLS"
          echo "ndk: $NDK_VERS"
          # ── Detect current Gradle wrapper version ──
          GRADLE_VER=""
          GP="$ROOT/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GP" ]; then
            GRADLE_VER=$(grep "distributionUrl" "$GP" | grep -oP '[\d]+\.[\d]+(\.[\d]+)?' | head -1 || true)
          fi
          echo "GRADLE_VER=${GRADLE_VER:-unknown}" >> $GITHUB_OUTPUT
          echo "Gradle: ${GRADLE_VER:-unknown}"
          # ── Determine if Gradle needs upgrade ──
          NEED_UPGRADE="no"
          TARGET_GRADLE=""
          if [ -n "$AGP" ] && [ -n "$GRADLE_VER" ]; then
            AGP_MAJ=$(echo "$AGP" | cut -d. -f1)
            GR_MAJ=$(echo "$GRADLE_VER" | cut -d. -f1)
            GR_MIN=$(echo "$GRADLE_VER" | cut -d. -f2)
            # AGP 9.x requires Gradle 9.3+
            if [ "$AGP_MAJ" -ge 9 ] 2>/dev/null && [ "$GR_MAJ" -lt 9 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="9.3.1"
            fi
            if [ "$AGP_MAJ" -ge 9 ] 2>/dev/null && [ "$GR_MAJ" -eq 9 ] 2>/dev/null && [ "$GR_MIN" -lt 3 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="9.3.1"
            fi
            # AGP 8.x requires Gradle 8.4+
            if [ "$AGP_MAJ" -eq 8 ] 2>/dev/null && [ "$GR_MAJ" -lt 8 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="8.10.2"
            fi
            if [ "$AGP_MAJ" -eq 8 ] 2>/dev/null && [ "$GR_MAJ" -eq 8 ] 2>/dev/null && [ "$GR_MIN" -lt 4 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="8.10.2"
            fi
            if [ "$AGP_MAJ" -eq 7 ] 2>/dev/null && [ "$GR_MAJ" -lt 7 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="7.6.4"
            fi
            if [ "$AGP_MAJ" -eq 7 ] 2>/dev/null && [ "$GR_MAJ" -eq 7 ] 2>/dev/null && [ "$GR_MIN" -lt 5 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="7.6.4"
            fi
            if [ "$AGP_MAJ" -ge 4 ] 2>/dev/null && [ "$AGP_MAJ" -le 6 ] 2>/dev/null && [ "$GR_MAJ" -lt 6 ] 2>/dev/null; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="6.9.4"
            fi
          fi
          if [ "$TYPE" = "flutter" ] && [ -n "$GRADLE_VER" ]; then
            GR_MAJ=$(echo "$GRADLE_VER" | cut -d. -f1)
            GR_MIN=$(echo "$GRADLE_VER" | cut -d. -f2)
            if [ "$GR_MAJ" -lt 8 ] 2>/dev/null || { [ "$GR_MAJ" -eq 8 ] 2>/dev/null && [ "$GR_MIN" -lt 10 ] 2>/dev/null; }; then
              NEED_UPGRADE="yes"; TARGET_GRADLE="8.10.2"
            fi
          fi
          echo "NEED_UPGRADE=$NEED_UPGRADE" >> $GITHUB_OUTPUT
          echo "TARGET_GRADLE=$TARGET_GRADLE" >> $GITHUB_OUTPUT
          echo "Gradle upgrade: $NEED_UPGRADE ${TARGET_GRADLE:-n/a}"

      # ──────────────────────────────────────────────
      # 3. SETUP TOOLCHAINS
      # ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.info.outputs.JAVA }}

      - name: Setup Flutter
        if: steps.info.outputs.TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ──────────────────────────────────────────────
      # 4. INSTALL SDK COMPONENTS + PATCH PROJECT
      # ──────────────────────────────────────────────
      - name: Install SDK components and patch project
        shell: bash
        run: |
          set +e
          cd "workspace/${{ steps.info.outputs.ROOT }}"
          # ── Install missing SDK platforms ──
          for S in ${{ steps.info.outputs.SDK }}; do
            if [ "$S" -ge 14 ] 2>/dev/null && [ "$S" -le 50 ] 2>/dev/null; then
              echo "Installing platform android-$S"
              yes 2>/dev/null | sdkmanager "platforms;android-$S" 2>/dev/null || true
            fi
          done
          # Also ensure common fallback platforms
          yes 2>/dev/null | sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" 2>/dev/null || true
          # ── Install missing build-tools ──
          for BT in ${{ steps.info.outputs.BT }}; do
            echo "Installing build-tools $BT"
            yes 2>/dev/null | sdkmanager "build-tools;$BT" 2>/dev/null || true
          done
          # Also ensure a fallback build-tools
          yes 2>/dev/null | sdkmanager "build-tools;34.0.0" "build-tools;36.0.0" 2>/dev/null || true
          # ── Install NDK versions ──
          for NK in ${{ steps.info.outputs.NDK }}; do
            echo "Installing NDK $NK"
            yes 2>/dev/null | sdkmanager "ndk;$NK" 2>/dev/null || true
          done
          # Ensure a default NDK is available
          yes 2>/dev/null | sdkmanager "ndk;26.1.10909125" 2>/dev/null || true
          # ── Upgrade Gradle wrapper if needed ──
          if [ "${{ steps.info.outputs.NEED_UPGRADE }}" = "yes" ]; then
            TG="${{ steps.info.outputs.TARGET_GRADLE }}"
            GP="gradle/wrapper/gradle-wrapper.properties"
            if [ -f "$GP" ]; then
              echo "Upgrading Gradle to $TG"
              sed -i "s|distributionUrl=.*|distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-$TG-bin.zip|" "$GP"
            fi
          fi
          # ── Patch: namespace injection for AGP 8+ ──
          AGP="${{ steps.info.outputs.AGP }}"
          AGP_MAJ=$(echo "$AGP" | cut -d. -f1)
          if [ -n "$AGP_MAJ" ] && [ "$AGP_MAJ" -ge 8 ] 2>/dev/null; then
            APP_BG=$(ls app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
            MANIFEST="app/src/main/AndroidManifest.xml"
            PKG=""
            [ -f "$MANIFEST" ] && PKG=$(grep -oP 'package\s*=\s*"[^"]+"' "$MANIFEST" | head -1 | grep -oP '"[^"]+"' | tr -d '"')
            if [ -n "$APP_BG" ] && [ -n "$PKG" ] && ! grep -q "namespace" "$APP_BG"; then
              echo "Injecting namespace: $PKG"
              TMPF=$(mktemp)
              if [[ "$APP_BG" == *.kts ]]; then
                echo "namespace = \"$PKG\"" > "$TMPF"
              else
                echo "namespace '$PKG'" > "$TMPF"
              fi
              cat "$APP_BG" >> "$TMPF"
              mv "$TMPF" "$APP_BG"
            fi
          fi
          # ── Patch: AGP 9.x compileSdk block syntax → plain integer ──
          if [ -n "$AGP_MAJ" ] && [ "$AGP_MAJ" -ge 9 ] 2>/dev/null; then
            for F in $(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -20); do
              if grep -qP 'compileSdk\s*\{' "$F" 2>/dev/null; then
                SDK_NUM=$(grep -oP 'compileSdk\s*\{[^}]*release\(\K\d+' "$F" 2>/dev/null | head -1 || true)
                [ -z "$SDK_NUM" ] && SDK_NUM=$(grep -oP 'compileSdk\s*\{[^}]*preview\("\K\d+' "$F" 2>/dev/null | head -1 || true)
                if [ -n "$SDK_NUM" ]; then
                  echo "Converting compileSdk block to compileSdk = $SDK_NUM in $F"
                  # Use Python to properly handle nested braces in compileSdk { ... } block
                  PY_FILE="$F" PY_SDK="$SDK_NUM" python3 -c "
          import re, os
          F = os.environ['PY_FILE']
          SDK = os.environ['PY_SDK']
          with open(F, 'r') as fh:
              lines = fh.readlines()
          new_lines = []
          skip_until_close = 0
          found = False
          for line in lines:
              if not found and re.search(r'compileSdk\s*\{', line):
                  new_lines.append(re.sub(r'compileSdk\s*\{.*', f'compileSdk = {SDK}', line))
                  opens = line.count('{') - line.count('}')
                  if opens <= 0:
                      found = True
                  else:
                      skip_until_close = opens
              elif skip_until_close > 0:
                  opens = line.count('{') - line.count('}')
                  skip_until_close += opens
                  if skip_until_close <= 0:
                      found = True
              else:
                  new_lines.append(line)
          with open(F, 'w') as fh:
              fh.writelines(new_lines)
          " 2>/dev/null || true
                fi
              fi
            done
          fi
          # ── Patch: generate debug.keystore if missing ──
          if ! [ -f "debug.keystore" ]; then
            echo "Generating debug.keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          fi
          # ── Patch: generate release keystore if missing and referenced ──
          for KS_NAME in "my-upload-key.jks" "upload.jks" "release.jks"; do
            if ! [ -f "$KS_NAME" ]; then
              # Check if any build.gradle references it
              for F in $(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -20); do
                if grep -q "$KS_NAME" "$F" 2>/dev/null; then
                  echo "Generating $KS_NAME for build"
                  keytool -genkeypair -v \
                    -keystore "$KS_NAME" -alias upload \
                    -keyalg RSA -keysize 2048 -validity 10000 \
                    -storepass novabuild -keypass novabuild \
                    -dname "CN=Nova,OU=Build,O=Nova,L=Unknown,ST=Unknown,C=US" 2>/dev/null || true
                  # Also patch build.gradle to use env vars or hardcoded values for signing
                  # Replace env var references with actual values since env vars won't be set
                  sed -i 's/System.getenv("STORE_PASSWORD") ?:.*}/"novabuild"/' "$F" 2>/dev/null || true
                  sed -i 's/System.getenv("KEY_PASSWORD") ?:.*}/"novabuild"/' "$F" 2>/dev/null || true
                  sed -i 's/System.getenv("STORE_PASSWORD")/"novabuild"/' "$F" 2>/dev/null || true
                  sed -i 's/System.getenv("KEY_PASSWORD")/"novabuild"/' "$F" 2>/dev/null || true
                  sed -i 's/System.getenv("KEYSTORE_PATH") ?:.*}/"'$(pwd)/$KS_NAME'"/' "$F" 2>/dev/null || true
                  break 2
                fi
              done
            fi
          done
          # ── Patch: create google-services.json if missing but plugin applied ──
          if ! [ -f "app/google-services.json" ]; then
            for F in $(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -20); do
              if grep -q 'google.services\|google-services\|com.google.gms.google-services' "$F" 2>/dev/null; then
                echo "Creating dummy google-services.json"
                cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project-placeholder",
              "storage_bucket": "dummy-project-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "com.example" }
              },
              "api_key": [{ "current_key": "AIzaSyDummyPlaceholderKey1234567890" }],
              "services": {
                "appinvite_service": { "status": 2 }
              }
            }],
            "configuration_version": "1"
          }
          GSEOF
                # Update package name in google-services.json to match applicationId
                APP_ID=""
                # First check applicationId in build.gradle.kts (takes precedence)
                for BG in $(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -10); do
                  APP_ID=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' "$BG" 2>/dev/null | head -1 || true)
                  [ -n "$APP_ID" ] && break
                done
                # Fallback to manifest package
                if [ -z "$APP_ID" ] && [ -f "app/src/main/AndroidManifest.xml" ]; then
                  APP_ID=$(grep -oP 'package\s*=\s*"[^"]+"' app/src/main/AndroidManifest.xml | head -1 | grep -oP '"[^"]+"' | tr -d '"')
                fi
                if [ -n "$APP_ID" ]; then
                  echo "Setting google-services.json package_name to $APP_ID"
                  sed -i "s/\"package_name\": \"com.example\"/\"package_name\": \"$APP_ID\"/" app/google-services.json
                fi
                break
              fi
            done
          fi
          # ── Patch: ensure .env file exists for secrets plugin ──
          if ! [ -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
              echo "Copied .env.example to .env"
            else
              touch .env
            fi
          fi
          # ── Patch: remove GoogleServicesStrategy import that may fail without proper classpath ──
          for F in $(find . -maxdepth 4 \( -name "build.gradle.kts" \) 2>/dev/null | head -20); do
            if grep -q 'GoogleServicesPlugin.MissingGoogleServicesStrategy' "$F" 2>/dev/null; then
              echo "Removing GoogleServicesPlugin import and googleServices config block from $F"
              sed -i '/GoogleServicesPlugin\.MissingGoogleServicesStrategy/d' "$F"
              # Remove the googleServices { missingGoogleServicesStrategy = ... } line entirely
              sed -i '/googleServices { missingGoogleServicesStrategy/d' "$F"
            fi
          done
          # ── Patch: generate gradlew + wrapper jar if missing ──
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            if ! [ -f "gradlew" ] || ! [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "Generating Gradle wrapper (gradlew + jar)"
              DETECTED_GRADLE="${{ steps.info.outputs.GRADLE_VER }}"
              [ -z "$DETECTED_GRADLE" ] && DETECTED_GRADLE="8.10.2"
              # Download Gradle distro to bootstrap the wrapper
              GRADLE_URL="https://services.gradle.org/distributions/gradle-${DETECTED_GRADLE}-bin.zip"
              echo "Downloading Gradle $DETECTED_GRADLE for wrapper generation"
              curl -sfL -o /tmp/gradle-boot.zip "$GRADLE_URL" || true
              if [ -f /tmp/gradle-boot.zip ]; then
                unzip -q /tmp/gradle-boot.zip -d /tmp/ 2>/dev/null || true
                GRADLE_BIN=$(ls -d /tmp/gradle-*/bin 2>/dev/null | head -1)
                if [ -n "$GRADLE_BIN" ]; then
                  export PATH="$GRADLE_BIN:$PATH"
                  gradle wrapper --gradle-version "$DETECTED_GRADLE" 2>/dev/null || true
                fi
                rm -rf /tmp/gradle-boot.zip /tmp/gradle-* 2>/dev/null || true
              fi
              # Ensure gradlew is executable
              chmod +x gradlew 2>/dev/null || true
            fi
          fi
          # ── Patch: remove hardcoded ndkVersion (let it auto-resolve) ──
          for F in $(find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -10); do
            if grep -q "ndkVersion" "$F" 2>/dev/null; then
              echo "Removing ndkVersion from $F"
              sed -i "/^[[:space:]]*ndkVersion/d" "$F"
            fi
          done
          # ── Patch: disable configuration-cache (can cause issues with some plugins in CI) ──
          if [ -f "gradle.properties" ] && grep -q "org.gradle.configuration-cache=true" "gradle.properties" 2>/dev/null; then
            echo "Disabling configuration-cache for CI compatibility"
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          fi
          # ── Patch: AndroidX migration ──
          if [ -f "gradle.properties" ]; then
            if ! grep -q "android.useAndroidX" "gradle.properties"; then
              echo "android.useAndroidX=true" >> gradle.properties
            fi
            if ! grep -q "android.enableJetifier" "gradle.properties"; then
              echo "android.enableJetifier=true" >> gradle.properties
            fi
          else
            echo "android.useAndroidX=true" > gradle.properties
            echo "android.enableJetifier=true" >> gradle.properties
          fi
          # ── Patch: replace old support libraries with AndroidX ──
          for F in $(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) 2>/dev/null | head -20); do
            sed -i "s|com.android.support:multidex|androidx.multidex:multidex|g" "$F" 2>/dev/null || true
            sed -i "s|com.android.support:appcompat-v7|androidx.appcompat:appcompat|g" "$F" 2>/dev/null || true
            sed -i "s|com.android.support:design|com.google.android.material:material|g" "$F" 2>/dev/null || true
            sed -i "s|com.android.support.constraint:constraint-layout|androidx.constraintlayout:constraintlayout|g" "$F" 2>/dev/null || true
          done
          # ── Patch: Kotlin version compatibility with AGP 8+ ──
          if [ -n "$AGP_MAJ" ] && [ "$AGP_MAJ" -ge 8 ] 2>/dev/null; then
            KOTLIN_VER=""
            for F in $(find . -maxdepth 3 \( -name "*.gradle" -o -name "*.gradle.kts" \) 2>/dev/null | head -20); do
              KV=$(grep -oP 'org\.jetbrains\.kotlin(?:\.android|\.jvm|\.kapt):kotlin-gradle-plugin:\K[\d]+\.[\d]+(\.[\d]+)?' "$F" 2>/dev/null | head -1)
              [ -n "$KV" ] && KOTLIN_VER="$KV" && break
            done
            if [ -n "$KOTLIN_VER" ]; then
              KOT_MAJ=$(echo "$KOTLIN_VER" | cut -d. -f1)
              KOT_MIN=$(echo "$KOTLIN_VER" | cut -d. -f2)
              echo "Kotlin: $KOTLIN_VER"
              # AGP 8.x needs Kotlin 1.8+
              if [ "$KOT_MAJ" -eq 1 ] && [ "$KOT_MIN" -lt 8 ] 2>/dev/null; then
                echo "Upgrading Kotlin to 1.9.22 for AGP 8 compatibility"
                for F in $(find . -maxdepth 3 \( -name "*.gradle" -o -name "*.gradle.kts" \) 2>/dev/null | head -20); do
                  sed -i "s|org\.jetbrains\.kotlin\(\.android\|\.jvm\|\.kapt\?\):kotlin-gradle-plugin:$KOTLIN_VER|org.jetbrains.kotlin\1:kotlin-gradle-plugin:1.9.22|g" "$F" 2>/dev/null || true
                  sed -i "s|kotlinVersion.*=.*\"$KOTLIN_VER\"|kotlinVersion = \"1.9.22\"|g" "$F" 2>/dev/null || true
                done
                # Also update in settings.gradle.kts plugins
                for F in $(find . -maxdepth 2 -name "settings.gradle.kts" 2>/dev/null | head -5); do
                  sed -i "s|id(\"org.jetbrains.kotlin.\") version \"$KOTLIN_VER\"|id(\"org.jetbrains.kotlin.android\") version \"1.9.22\"|g" "$F" 2>/dev/null || true
                done
                # Update gradle.properties
                for F in $(find . -maxdepth 2 -name "gradle.properties" 2>/dev/null | head -5); do
                  sed -i "s|kotlin_version.*=.*$KOTLIN_VER|kotlin_version=1.9.22|g" "$F" 2>/dev/null || true
                done
              fi
            fi
          fi
          # ── Patch: increase JVM memory ──
          if [ -f "gradle.properties" ]; then
            if ! grep -q "org.gradle.jvmargs" "gradle.properties"; then
              echo "org.gradle.jvmargs=-Xmx3g" >> gradle.properties
            else
              sed -i "s|org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx3g|" gradle.properties
            fi
          fi
          # ── Patch: add common R8/ProGuard keep rules for known libraries ──
          PROGUARD_FILE=""
          for PF in "app/proguard-rules.pro" "proguard-rules.pro" "app/proguard.pro" "proguard.pro"; do
            if [ -f "$PF" ]; then
              PROGUARD_FILE="$PF"
              break
            fi
          done
          if [ -z "$PROGUARD_FILE" ]; then
            PROGUARD_FILE="app/proguard-rules.pro"
            touch "$PROGUARD_FILE" 2>/dev/null || true
          fi
          if [ -f "$PROGUARD_FILE" ]; then
            echo "Adding common R8 keep rules to $PROGUARD_FILE"
            # Rhino (org.mozilla.javascript) references java.beans which is not in Android
            grep -q "java.beans" "$PROGUARD_FILE" 2>/dev/null || echo "-dontwarn java.beans.**" >> "$PROGUARD_FILE"
            # Common libraries that reference missing JVM classes
            grep -q "java.awt" "$PROGUARD_FILE" 2>/dev/null || echo "-dontwarn java.awt.**" >> "$PROGUARD_FILE"
            grep -q "javax.swing" "$PROGUARD_FILE" 2>/dev/null || echo "-dontwarn javax.swing.**" >> "$PROGUARD_FILE"
            grep -q "javax.xml.bind" "$PROGUARD_FILE" 2>/dev/null || echo "-dontwarn javax.xml.bind.**" >> "$PROGUARD_FILE"
            grep -q "java.management" "$PROGUARD_FILE" 2>/dev/null || echo "-dontwarn java.management.**" >> "$PROGUARD_FILE"
            # Ensure proguard file is referenced in build.gradle
            for BG in $(find . -maxdepth 3 -name "build.gradle.kts" -path "*/app/*" 2>/dev/null | head -3); do
              if ! grep -q "proguardFiles" "$BG" 2>/dev/null; then
                echo "Note: $PROGUARD_FILE created but may need proguardFiles reference in $BG"
              fi
            done
          fi
          chmod +x gradlew 2>/dev/null || true
          echo "All patches applied"

      # ──────────────────────────────────────────────
      # 5. BUILD WITH AI SELF-HEALING
      # ──────────────────────────────────────────────
      - name: Build with AI self-healing
        id: build
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"
        run: |
          set +e
          cd "workspace/${{ steps.info.outputs.ROOT }}"
          LOG="$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/build-artifacts"
          TYPE="${{ steps.info.outputs.TYPE }}"
          MAX_RETRIES=3
          RETRY=0

          # ── Build function ──
          run_build() {
            OK=false
            if [ "$TYPE" = "android" ]; then
              if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
                echo "=== Attempt $((RETRY+1)): gradlew assembleRelease ==="
                ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$LOG"
                [ ${PIPESTATUS[0]} -eq 0 ] && OK=true
              fi
              if [ "$OK" = false ]; then
                FALLBACK_GRADLE="${{ steps.info.outputs.GRADLE_VER }}"
                [ -z "$FALLBACK_GRADLE" ] && FALLBACK_GRADLE="8.10.2"
                echo "=== Attempt $((RETRY+1)): system gradle $FALLBACK_GRADLE ==="
                wget -q "https://services.gradle.org/distributions/gradle-${FALLBACK_GRADLE}-bin.zip"
                unzip -q "gradle-${FALLBACK_GRADLE}-bin.zip"
                export PATH="$PWD/gradle-${FALLBACK_GRADLE}/bin:$PATH"
                gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$LOG"
                [ ${PIPESTATUS[0]} -eq 0 ] && OK=true
              fi
            elif [ "$TYPE" = "flutter" ]; then
              AB="android/app/build.gradle"
              [ -f "$AB" ] && sed -i "/^[[:space:]]*ndkVersion/d" "$AB"
              [ -f "android/gradle.properties" ] && {
                grep -q "org.gradle.jvmargs" "android/gradle.properties" || echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties
                grep -q "android.useAndroidX" "android/gradle.properties" || echo "android.useAndroidX=true" >> android/gradle.properties
                grep -q "android.enableJetifier" "android/gradle.properties" || echo "android.enableJetifier=true" >> android/gradle.properties
              }
              flutter pub get 2>&1 | tail -20
              echo "=== Attempt $((RETRY+1)): flutter build apk ==="
              flutter build apk --release 2>&1 | tee "$LOG"
              [ ${PIPESTATUS[0]} -eq 0 ] && OK=true
            fi
            cp "$LOG" "$RUNNER_TEMP/build-artifacts/build.log" 2>/dev/null || true
            echo "$OK"
          }

          # ── AI analysis function ──
          ai_analyze_and_patch() {
            echo ""
            echo "╔══════════════════════════════════════════════════╗"
            echo "║  🤖 AI Build Analysis — Attempt $((RETRY+1)) of $MAX_RETRIES    ║"
            echo "╚══════════════════════════════════════════════════╝"

            # Determine API provider: Groq (preferred) or custom AI_API_KEY
            if [ -n "$GROQ_API_KEY" ]; then
              AI_API_KEY="$GROQ_API_KEY"
              AI_API_URL="${AI_API_URL:-https://api.groq.com/openai/v1/chat/completions}"
              AI_MODEL="${AI_MODEL:-llama-3.3-70b-versatile}"
              echo "🔌 Using Groq API (model: $AI_MODEL)"
            elif [ -n "$AI_API_KEY" ]; then
              AI_API_URL="${AI_API_URL:-https://api.openai.com/v1/chat/completions}"
              AI_MODEL="${AI_MODEL:-gpt-4o-mini}"
              echo "🔌 Using custom AI API (model: $AI_MODEL)"
            else
              echo "⚠️  No GROQ_API_KEY or AI_API_KEY secret configured — skipping AI analysis"
              echo "💡 Tip: Add GROQ_API_KEY secret to enable AI self-healing (free at console.groq.com)"
              return 1
            fi

            # Extract last 200 lines of error from build log
            ERROR_SECTION=$(tail -200 "$LOG" | grep -A200 "FAILURE\|FAILED\|error:" || tail -200 "$LOG")

            # Collect relevant source files for AI context
            CONTEXT_FILES=""
            for F in $(find . -maxdepth 4 \( -name "*.gradle.kts" -o -name "*.gradle" -o -name "*.properties" -o -name "*.toml" \) -not -path "*/.gradle/*" 2>/dev/null | head -15); do
              CONTENT=$(head -80 "$F" 2>/dev/null || true)
              CONTEXT_FILES="${CONTEXT_FILES}"$'\n'"--- ${F} ---"$'\n'"${CONTENT}"
            done

            # Build AI prompt using a temp file to avoid YAML/heredoc issues
            PROMPT_FILE="$RUNNER_TEMP/ai_prompt.txt"
            python3 -c "
          import os
          prompt = '''Analyze this Android/Flutter build failure and determine if it can be auto-fixed.

          COMMON AUTO-FIXABLE PATTERNS:
          - Missing or wrong import statements (e.g. GoogleServicesPlugin, FirebasePlugin)
          - Plugin config blocks that reference unavailable classes
          - Version mismatches between AGP and Gradle wrapper
          - compileSdk block syntax that needs conversion to plain integer
          - Missing google-services.json or wrong package_name in it
          - Missing keystore files or signing config referencing env vars not set
          - System.getenv() calls for passwords that have no env vars in CI
          - Missing .env file for secrets gradle plugin
          - configuration-cache incompatibility with certain plugins
          - Kotlin version too old for current AGP
          - Missing gradlew or wrapper jar files

          INSTRUCTIONS:
          If the error is AUTO-FIXABLE (config/build issue, not a real code bug), respond:
          {\"action\":\"patch\",\"explanation\":\"what was wrong\",\"patches\":[{\"file\":\"path\",\"find\":\"exact text\",\"replace\":\"fixed text\"}]}

          Rules for patches:
          - find must be an EXACT substring from the source files - copy it character-for-character
          - replace is the corrected version
          - Multiple patches allowed in the array

          If the error is a REAL CODE BUG (logic error, missing source, API incompatibility), respond:
          {\"action\":\"report\",\"explanation\":\"clear explanation of what went wrong and what the developer should do\"}

          Respond with ONLY valid JSON.
          '''
          with open(os.environ['PROMPT_FILE'], 'w') as f:
              f.write(prompt)
          " 2>/dev/null
            export PROMPT_FILE

            # Append dynamic context to the prompt file
            {
              echo ""
              echo "BUILD ERROR LOG (last 200 lines):"
              echo "${ERROR_SECTION}"
              echo ""
              echo "RELEVANT SOURCE FILES:"
              echo "${CONTEXT_FILES}"
              echo ""
              echo "PROJECT INFO: Type=${TYPE}, AGP=${{ steps.info.outputs.AGP }}, Gradle=${{ steps.info.outputs.GRADLE_VER }}, Java=${{ steps.info.outputs.JAVA }}"
            } >> "$PROMPT_FILE"

            PROMPT=$(cat "$PROMPT_FILE")

            echo "📡 Calling AI ($AI_MODEL) to analyze build failure..."

            # Escape prompt for JSON
            PROMPT_JSON=$(printf '%s' "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

            # Call AI API with retry for rate limits (Groq free tier: 30 RPM)
            # Build request body — try json_object mode first, fallback without it
            REQ_BODY="{\"model\":\"$AI_MODEL\",\"messages\":[{\"role\":\"system\",\"content\":\"You are an expert Android/Gradle build error analyst. Always respond with valid JSON only. No markdown, no explanation outside JSON.\"},{\"role\":\"user\",\"content\":$PROMPT_JSON}],\"max_tokens\":2000,\"temperature\":0.1,\"response_format\":{\"type\":\"json_object\"}}"
            REQ_BODY_NO_JSON_MODE="{\"model\":\"$AI_MODEL\",\"messages\":[{\"role\":\"system\",\"content\":\"You are an expert Android/Gradle build error analyst. Always respond with valid JSON only. No markdown, no explanation outside JSON.\"},{\"role\":\"user\",\"content\":$PROMPT_JSON}],\"max_tokens\":2000,\"temperature\":0.1}"

            AI_RESPONSE=""
            for ATTEMPT in 1 2 3; do
              # Try with json_object mode first, fallback without if model doesn't support it
              AI_RESPONSE=$(curl -s --max-time 90 \
                -H "Authorization: Bearer $AI_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$REQ_BODY" \
                "$AI_API_URL" 2>/dev/null || true)

              # Check for empty response (network error, 403, etc.)
              if [ -z "$AI_RESPONSE" ]; then
                echo "⚠️  Empty response from AI API (attempt $ATTEMPT/3)"
                sleep ${ATTEMPT}0
                continue
              fi

              # Check for HTTP error responses that aren't JSON
              if ! echo "$AI_RESPONSE" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
                echo "⚠️  Non-JSON response from AI API (attempt $ATTEMPT/3): ${AI_RESPONSE:0:200}"
                sleep ${ATTEMPT}0
                continue
              fi

              # If response contains json_mode error, retry without response_format
              if echo "$AI_RESPONSE" | grep -qi 'json.*mode\|response_format\|not supported\|unsupported.*parameter'; then
                echo "⚠️  Model doesn't support json_object mode, retrying without it..."
                AI_RESPONSE=$(curl -s --max-time 90 \
                  -H "Authorization: Bearer $AI_API_KEY" \
                  -H "Content-Type: application/json" \
                  -d "$REQ_BODY_NO_JSON_MODE" \
                  "$AI_API_URL" 2>/dev/null || true)
              fi

              [ -z "$AI_RESPONSE" ] && AI_RESPONSE='{"error":"api_call_failed"}'

              # Check for API errors (rate limit, forbidden, invalid key)
              if echo "$AI_RESPONSE" | grep -qi 'rate_limit\|429\|rate_limit_exceeded'; then
                echo "⏳ Rate limited (attempt $ATTEMPT/3), waiting ${ATTEMPT}0s..."
                sleep ${ATTEMPT}0
                continue
              fi
              if echo "$AI_RESPONSE" | grep -qi 'forbidden\|403\|invalid.*key\|unauthorized\|401'; then
                echo "❌ AI API key is invalid or unauthorized. Check your GROQ_API_KEY secret."
                echo "   Go to https://console.groq.com/keys to verify your key"
                AI_RESPONSE='{"error":"auth_failed"}'
                break
              fi
              break
            done

            # Extract AI message content
            AI_CONTENT=$(echo "$AI_RESPONSE" | python3 -c '
          import json,sys
          try:
              data = json.load(sys.stdin)
              if "error" in data:
                  print("ERROR: AI API call failed")
              else:
                  print(data["choices"][0]["message"]["content"])
          except:
              print("ERROR: Failed to parse AI response")
          ' 2>/dev/null || echo "ERROR: AI response parse failed")

            if echo "$AI_CONTENT" | grep -q "^ERROR:"; then
              echo "❌ AI analysis failed: $AI_CONTENT"
              return 1
            fi

            echo "🤖 AI Response:"
            echo "$AI_CONTENT"
            echo ""

            # Parse AI response — extract JSON from possible markdown code blocks
            AI_JSON=$(echo "$AI_CONTENT" | python3 -c '
          import json,sys,re
          text = sys.stdin.read().strip()
          m = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", text, re.DOTALL)
          if m:
              print(m.group(1))
          else:
              m = re.search(r"\{.*\}", text, re.DOTALL)
              if m:
                  print(m.group(0))
              else:
                  print("{}")
          ' 2>/dev/null || echo '{}')

            ACTION=$(echo "$AI_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('action','unknown'))" 2>/dev/null || echo "unknown")
            EXPLANATION=$(echo "$AI_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('explanation','No explanation'))" 2>/dev/null || echo "No explanation")

            echo "📋 Action: $ACTION"
            echo "📝 Explanation: $EXPLANATION"

            if [ "$ACTION" = "patch" ]; then
              # Apply patches
              PATCH_COUNT=$(echo "$AI_JSON" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('patches',[])))" 2>/dev/null || echo "0")
              echo "🔧 Applying $PATCH_COUNT patch(es)..."

              # Use Python to apply patches (handles find/replace safely)
              echo "$AI_JSON" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for i, p in enumerate(data.get("patches", [])):
              fpath = p.get("file", "")
              find_text = p.get("find", "")
              replace_text = p.get("replace", "")
              try:
                  with open(fpath, "r") as f:
                      content = f.read()
                  if find_text in content:
                      content = content.replace(find_text, replace_text, 1)
                      with open(fpath, "w") as f:
                          f.write(content)
                      print(f"  Patch {i+1}: Applied to {fpath}")
                  else:
                      print(f"  Patch {i+1}: Find text not found in {fpath}, skipping")
              except Exception as e:
                  print(f"  Patch {i+1}: Failed on {fpath}: {e}")
          ' 2>/dev/null || echo "  Patch application failed"

              echo ""
              echo "✅ Patches applied — retrying build..."
              return 0

            elif [ "$ACTION" = "report" ]; then
              echo ""
              echo "╔══════════════════════════════════════════════════╗"
              echo "║  🚨 UNFIXABLE BUILD ERROR — AI Report            ║"
              echo "╚══════════════════════════════════════════════════╝"
              echo ""
              echo "$EXPLANATION"
              echo ""
              # Save report for the summary step
              echo "AI_REPORT<<EOF" >> $GITHUB_ENV
              echo "$EXPLANATION" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              echo "AI_ACTION=report" >> $GITHUB_ENV
              return 1
            else
              echo "⚠️  AI returned unknown action: $ACTION"
              return 1
            fi
          }

          # ── Main build loop ──
          while [ $RETRY -lt $MAX_RETRIES ]; do
            RESULT=$(run_build)
            if [ "$RESULT" = true ]; then
              echo "BUILD_SUCCEEDED=true" >> $GITHUB_ENV
              echo "✅ Build succeeded on attempt $((RETRY+1))"
              find . -name "*.apk" 2>/dev/null
              exit 0
            fi

            echo "❌ Build failed on attempt $((RETRY+1))"

            # Try AI healing
            if ai_analyze_and_patch; then
              RETRY=$((RETRY + 1))
              echo "🔄 Retrying build (attempt $((RETRY+1)) of $MAX_RETRIES)..."
              echo "---"
              continue
            else
              # AI couldn't fix it or no AI key — check if we should still retry
              if [ "${AI_ACTION}" = "report" ]; then
                # AI says unfixable — don't retry
                break
              fi
              RETRY=$((RETRY + 1))
              if [ $RETRY -lt $MAX_RETRIES ]; then
                echo "🔄 Retrying build without AI fix (attempt $((RETRY+1)) of $MAX_RETRIES)..."
              fi
            fi
          done

          # All retries exhausted
          echo "BUILD_SUCCEEDED=false" >> $GITHUB_ENV
          echo "❌ Build failed after $MAX_RETRIES attempts"
          tail -80 "$LOG"
          exit 1

      - name: Create GitHub Issue for unfixable error
        if: failure() && env.AI_ACTION == 'report'
        run: |
          TITLE="🤖 Build failed — AI analysis: unfixable error"
          BODY="## 🤖 AI Build Error Analysis

          The AI analyzed the build failure and determined it **cannot be auto-fixed**. This requires manual developer attention.

          ### AI Explanation
          ${AI_REPORT:-No AI report available.}

          ---
          *This issue was auto-created by the nova-apk-builder AI introspection system.*
          *Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*"

          # Create issue using GitHub API
          TITLE_JSON=$(printf '%s' "$TITLE" | jq -Rs '.')
          BODY_JSON=$(printf '%s' "$BODY" | jq -Rs '.')

          ISSUE_URL=$(curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"title\":$TITLE_JSON,\"body\":$BODY_JSON,\"labels\":[\"build-failure\",\"ai-analyzed\"]}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" | jq -r '.html_url' 2>/dev/null || echo "failed")

          if [ "$ISSUE_URL" != "failed" ] && [ -n "$ISSUE_URL" ]; then
            echo "📝 Created GitHub issue: $ISSUE_URL"
            echo "AI_ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV
          else
            echo "⚠️  Could not create GitHub issue (labels may not exist), retrying without labels..."
            ISSUE_URL=$(curl -sf -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"title\":$TITLE_JSON,\"body\":$BODY_JSON}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/issues" | jq -r '.html_url' 2>/dev/null || echo "failed")
            if [ "$ISSUE_URL" != "failed" ] && [ -n "$ISSUE_URL" ]; then
              echo "📝 Created GitHub issue: $ISSUE_URL"
              echo "AI_ISSUE_URL=$ISSUE_URL" >> $GITHUB_ENV
            fi
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build-artifacts/

      # ──────────────────────────────────────────────
      # 6. LOCATE + NAME APK
      # ──────────────────────────────────────────────
      - name: Locate APK
        id: apk
        run: |
          cd "workspace/${{ steps.info.outputs.ROOT }}"
          P=$(find . -name "*.apk" -path "*/release/*" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*-release.apk" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*.apk" -not -path "*test*" -not -path "*debug*" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*.apk" -print -quit 2>/dev/null)
          [ -z "$P" ] && echo "ERROR: No APK found" && exit 1
          NAME=$(basename "$P")
          SIZE=$(stat -c%s "$P" 2>/dev/null || stat -f%z "$P")
          echo "PATH=$P" >> $GITHUB_OUTPUT
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK: $P ($SIZE bytes)"

      - name: Get app name
        id: app
        run: |
          cd "workspace/${{ steps.info.outputs.ROOT }}"
          ANAME="app"
          # Android: try android:label in manifest
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            LBL=$(grep -oP 'android:label\s*=\s*"[^"]+"' app/src/main/AndroidManifest.xml 2>/dev/null | head -1 | grep -oP '"[^"]+"' | tr -d '"' | sed 's/@string\///')
            if [ -n "$LBL" ]; then
              if echo "$LBL" | grep -q "@string/"; then
                RES=$(echo "$LBL" | sed 's/@string\///')
                STRINGS=$(find app/src/main/res -name "strings.xml" -print -quit 2>/dev/null)
                if [ -f "$STRINGS" ]; then
                  VAL=$(grep -oP "<string name=\"$RES\">[^<]+<" "$STRINGS" 2>/dev/null | head -1 | sed 's/.*>\(.*\)<.*/\1/')
                  [ -n "$VAL" ] && ANAME="$VAL"
                fi
              else
                ANAME="$LBL"
              fi
            fi
          fi
          # Flutter: try pubspec.yaml name
          if [ "${{ steps.info.outputs.TYPE }}" = "flutter" ] && [ "$ANAME" = "app" ]; then
            PN=$(grep "^name:" pubspec.yaml 2>/dev/null | head -1 | awk '{print $2}')
            if [ -n "$PN" ]; then
              ANAME=$(echo "$PN" | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g')
            fi
          fi
          # Fallback: use app_name from APK via aapt
          if [ "$ANAME" = "app" ]; then
            APK_PATH="${{ steps.apk.outputs.PATH }}"
            if [ -f "$APK_PATH" ]; then
              AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)/aapt2"
              if [ ! -f "$AAPT" ]; then
                AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)/aapt"
              fi
              if [ -f "$AAPT" ]; then
                APK_LABEL=$("$AAPT" dump badging "$APK_PATH" 2>/dev/null | grep "application: label=" | head -1 | grep -oP "label='\K[^']*")
                [ -n "$APK_LABEL" ] && ANAME="$APK_LABEL"
              fi
            fi
          fi
          CLEAN=$(echo "$ANAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9._-')
          [ -z "$CLEAN" ] && CLEAN="app"
          echo "NAME=$ANAME" >> $GITHUB_OUTPUT
          echo "CLEAN=$CLEAN" >> $GITHUB_OUTPUT
          echo "App: $ANAME (file: $CLEAN.apk)"

      # ──────────────────────────────────────────────
      # 7. SIGN APK
      # ──────────────────────────────────────────────
      - name: Sign APK (generate key)
        if: inputs.signing_mode == 'generate'
        run: |
          SRC="workspace/${{ steps.info.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          KS="$RUNNER_TEMP/sign.jks"
          PW="nova_$(head /dev/urandom | tr -dc a-zA-Z0-9 | head -c 24)"
          keytool -genkeypair -v \
            -keystore "$KS" -alias nova \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Nova,OU=Build,O=Nova,L=Unknown,ST=Unknown,C=US"
          T="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)"
          "$T/zipalign" -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$PW" \
            --ks-key-alias nova --key-pass "pass:$PW" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" "$SRC"
          printf "storeFile=signing.jks\nstorePassword=%s\nkeyAlias=nova\nkeyPassword=%s\n" "$PW" "$PW" > "$RUNNER_TEMP/keystore.txt"

      - name: Sign APK (existing key)
        if: inputs.signing_mode == 'existing'
        run: |
          SRC="workspace/${{ steps.info.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/existing.jks"
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          K_ALIAS="${{ secrets.KEY_ALIAS }}"
          K_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KS_PASS" ] || [ -z "$K_ALIAS" ] && echo "ERROR: Signing secrets missing" && exit 1
          T="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)"
          "$T/zipalign" -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" sign \
            --ks "$RUNNER_TEMP/existing.jks" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --key-pass "pass:${K_PASS:-$KS_PASS}" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" "$SRC"

      # ──────────────────────────────────────────────
      # 8. UPLOAD + PUBLISH
      # ──────────────────────────────────────────────
      - name: Upload APK to release
        run: |
          SRC="workspace/${{ steps.info.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          RID="${{ inputs.release_id }}"
          FNAME="${{ steps.app.outputs.CLEAN }}.apk"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$SRC" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=$FNAME"

      - name: Upload signing key
        if: inputs.signing_mode == 'generate'
        run: |
          RID="${{ inputs.release_id }}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/sign.jks" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=signing.jks"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@$RUNNER_TEMP/keystore.txt" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=keystore-properties.txt"

      - name: Publish release
        run: |
          RID="${{ inputs.release_id }}"
          ANAME="${{ steps.app.outputs.NAME }}"
          ASIZE="${{ steps.apk.outputs.SIZE }}"
          ATYPE="${{ steps.info.outputs.TYPE }}"
          SMODE="${{ inputs.signing_mode }}"
          BF="$RUNNER_TEMP/body.txt"
          EXTRA_LINE=""
          [ "$SMODE" = "generate" ] && EXTRA_LINE=". Save the signing key for future updates."
          {
            echo "APK build succeeded."
            echo ""
            echo "- App: $ANAME"
            echo "- APK: ${{ steps.app.outputs.CLEAN }}.apk ($ASIZE bytes)"
            echo "- Type: $ATYPE"
            echo "- Signing: $SMODE"
            [ -n "$EXTRA_LINE" ] && echo ""
            [ -n "$EXTRA_LINE" ] && echo "$EXTRA_LINE"
          } > "$BF"
          BJSON=$(jq -Rs '.' "$BF")
          NJSON=$(printf '%s' "$ANAME" | jq -Rs '.')
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":$NJSON,\"body\":$BJSON,\"draft\":false}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/$RID"

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ${{ steps.app.outputs.NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.info.outputs.TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AGP**: ${{ steps.info.outputs.AGP }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Java**: ${{ steps.info.outputs.JAVA }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ steps.app.outputs.CLEAN }}.apk (${{ steps.apk.outputs.SIZE }} bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: ${{ inputs.signing_mode }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${AI_REPORT:-}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🤖 AI Analysis" >> $GITHUB_STEP_SUMMARY
            echo "${AI_REPORT}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "${AI_ISSUE_URL:-}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📋 **GitHub Issue**: ${AI_ISSUE_URL}" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${BUILD_SUCCEEDED:-}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          fi
