name: Build APK
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "GitHub Release ID for output"
        required: true
        type: string
      blob_sha:
        description: "Git blob SHA containing the source ZIP"
        required: true
        type: string
      signing_mode:
        description: "Signing mode: generate or existing"
        required: true
        type: string
        default: generate

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download source ZIP
        run: |
          BLOB_SHA="${{ inputs.blob_sha }}"
          if command -v gh &>/dev/null; then
            if gh api "repos/${{ github.repository }}/git/blobs/$BLOB_SHA" \
              -H "Accept: application/vnd.github.v3.raw" > source.zip 2>&1; then
              echo "Downloaded via gh"
            else
              rm -f source.zip
            fi
          fi
          if [ ! -s source.zip ]; then
            curl -sfL -o source.zip \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" || true
          fi
          if [ ! -s source.zip ]; then
            curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" | \
              jq -r .content | base64 -d > source.zip
          fi
          if [ ! -s source.zip ] || ! file source.zip | grep -q "Zip archive"; then
            echo "ERROR: Could not download valid ZIP"
            exit 1
          fi
          ZIP_SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          echo "ZIP: $ZIP_SIZE bytes"

      - name: Extract and detect project
        id: detect
        run: |
          mkdir -p workspace && cd workspace && unzip -o ../source.zip && cd ..
          cd workspace
          ROOT="" && TYPE=""
          is_flutter() { [ -f "$1/pubspec.yaml" ] && grep -q "flutter:" "$1/pubspec.yaml" 2>/dev/null; }
          is_android() { [ -f "$1/settings.gradle" ] || [ -f "$1/settings.gradle.kts" ] || ([ -f "$1/build.gradle" ] && [ -d "$1/app" ]); }
          for search in "." "*/" "*/*/"; do
            for d in $search; do
              [ -d "$d" ] || continue
              d="${d%/}"
              if [ -z "$ROOT" ]; then
                if is_flutter "$d"; then ROOT="$d"; TYPE="flutter"
                elif is_android "$d"; then ROOT="$d"; TYPE="android"; fi
              fi
            done
          done
          if [ -z "$ROOT" ]; then
            echo "ERROR: No Android/Flutter project found"
            find . -maxdepth 4 -type f | head -30
            exit 1
          fi
          echo "ROOT=$ROOT" >> $GITHUB_OUTPUT
          echo "TYPE=$TYPE" >> $GITHUB_OUTPUT
          echo "Found $TYPE at $ROOT"
          find "$ROOT" -maxdepth 2 -type f | head -30

      - name: Pick Java version
        id: java
        run: |
          if [ "${{ steps.detect.outputs.TYPE }}" = "flutter" ]; then
            echo "VER=17" >> $GITHUB_OUTPUT
            echo "Flutter: Java 17"
            exit 0
          fi
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          VER="17"
          AGP=$(grep -rh "com.android.application" --include="*.gradle" --include="*.gradle.kts" . 2>/dev/null | grep -oP '[\d]+\.[\d]+(\.[\d]+)?' | head -1)
          if [ -n "$AGP" ]; then
            MAJOR=$(echo "$AGP" | cut -d. -f1)
            echo "AGP: $AGP (major $MAJOR)"
            if [ "$MAJOR" -lt 8 ] 2>/dev/null; then VER="11"; fi
          else
            echo "AGP not found, defaulting Java 17"
          fi
          echo "VER=$VER" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.VER }}

      - name: Setup Flutter
        if: steps.detect.outputs.TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch Android project
        if: steps.detect.outputs.TYPE == 'android'
        run: |
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          APP_BG=$(ls app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          MANIFEST="app/src/main/AndroidManifest.xml"
          PKG=""
          [ -f "$MANIFEST" ] && PKG=$(grep -oP 'package\s*=\s*"[^"]+"' "$MANIFEST" | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          echo "Package: ${PKG:-none}"
          if [ -n "$APP_BG" ] && [ -n "$PKG" ] && ! grep -q "namespace" "$APP_BG"; then
            echo "Injecting namespace: $PKG"
            TMPF=$(mktemp)
            echo "namespace '$PKG'" > "$TMPF"
            cat "$APP_BG" >> "$TMPF"
            mv "$TMPF" "$APP_BG"
          fi
          GRADLE_PROP="gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            V=$(grep "distributionUrl" "$GRADLE_PROP" | grep -oP '[\d]+\.[\d]+' | head -1 || true)
            echo "Gradle: ${V:-unknown}"
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Build Android APK
        if: steps.detect.outputs.TYPE == 'android'
        shell: bash
        run: |
          set -o pipefail
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          LOG="$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/build-artifacts"
          OK=false
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "=== gradlew assembleRelease ==="
            if ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$LOG"; then OK=true; fi
          fi
          if [ "$OK" = false ]; then
            echo "=== Fallback: system gradle ==="
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip
            export PATH="$PWD/gradle-8.4/bin:$PATH"
            if gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$LOG"; then OK=true; fi
          fi
          cp "$LOG" "$RUNNER_TEMP/build-artifacts/build.log" 2>/dev/null || true
          if [ "$OK" = false ]; then
            echo "ERROR: Build failed"
            tail -60 "$LOG"
            exit 1
          fi
          find . -name "*.apk" 2>/dev/null

      - name: Build Flutter APK
        if: steps.detect.outputs.TYPE == 'flutter'
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"
        run: |
          set -o pipefail
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          LOG="$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/build-artifacts"
          GP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GP" ]; then
            V=$(grep "distributionUrl" "$GP" | grep -oP '[\d]+\.[\d]+' | head -1 || true)
            M=$(echo "$V" | cut -d. -f1)
            N=$(echo "$V" | cut -d. -f2)
            if [ -n "$M" ] && [ -n "$N" ] && { [ "$M" -lt 8 ] || { [ "$M" -eq 8 ] && [ "$N" -lt 10 ]; }; }; then
              echo "Upgrading Gradle to 8.10"
              sed -i "s|distributionUrl=.*|distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.10-bin.zip|" "$GP"
            fi
          fi
          AB="android/app/build.gradle"
          if [ -f "$AB" ]; then
            sed -i "/^[[:space:]]*ndkVersion/d" "$AB"
            sed -i "s|com.android.support:multidex|androidx.multidex:multidex|g" "$AB"
          fi
          echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          flutter pub get 2>&1 | tail -20
          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          P=0
          for F in $(grep -rl "flutter " "$PUB_CACHE/hosted" --include="*.gradle" 2>/dev/null); do
            sed -i "/^[[:space:]]*flutter[[:space:]]*{/,/}/d" "$F"
            P=$((P + 1))
          done
          echo "Patched $P plugins"
          set +e
          flutter build apk --release 2>&1 | tee "$LOG"
          EX=${PIPESTATUS[0]}
          set -e
          cp "$LOG" "$RUNNER_TEMP/build-artifacts/build.log" 2>/dev/null || true
          if [ "$EX" -ne 0 ]; then
            echo "ERROR: Flutter build failed"
            tail -80 "$LOG"
            exit 1
          fi
          find . -name "*.apk" 2>/dev/null

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build-artifacts/

      - name: Locate APK
        id: apk
        run: |
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          P=$(find . -name "*.apk" -path "*/release/*" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*-release.apk" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*.apk" -not -path "*test*" -not -path "*debug*" -print -quit 2>/dev/null)
          [ -z "$P" ] && P=$(find . -name "*.apk" -print -quit 2>/dev/null)
          [ -z "$P" ] && echo "ERROR: No APK found" && exit 1
          NAME=$(basename "$P")
          SIZE=$(stat -c%s "$P" 2>/dev/null || stat -f%z "$P")
          echo "PATH=$P" >> $GITHUB_OUTPUT
          echo "NAME=$NAME" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT
          echo "APK: $P ($SIZE bytes)"

      - name: Get app name
        id: app
        run: |
          cd "workspace/${{ steps.detect.outputs.ROOT }}"
          ANAME="app"
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            LBL=$(grep -oP 'android:label\s*=\s*"[^"]+"' app/src/main/AndroidManifest.xml 2>/dev/null | head -1 | grep -oP '"[^"]+"' | tr -d '"' | sed 's/@string\///')
            if [ -n "$LBL" ]; then
              if echo "$LBL" | grep -q "@string/"; then
                RES=$(echo "$LBL" | sed 's/@string\///')
                STRINGS=$(find app/src/main/res -name "strings.xml" -print -quit 2>/dev/null)
                if [ -f "$STRINGS" ]; then
                  VAL=$(grep -oP "<string name=\"$RES\">[^<]+<" "$STRINGS" 2>/dev/null | head -1 | sed 's/.*>\(.*\)<.*/\1/')
                  [ -n "$VAL" ] && ANAME="$VAL"
                fi
              else
                ANAME="$LBL"
              fi
            fi
          fi
          if [ "${{ steps.detect.outputs.TYPE }}" = "flutter" ] && [ "$ANAME" = "app" ]; then
            PN=$(grep "^name:" pubspec.yaml 2>/dev/null | head -1 | awk '{print $2}')
            if [ -n "$PN" ]; then
              ANAME=$(echo "$PN" | sed 's/_/ /g' | sed 's/\b\(.\)/\u\1/g')
            fi
          fi
          CLEAN=$(echo "$ANAME" | tr ' ' '-' | tr -cd 'a-zA-Z0-9._-')
          echo "NAME=$ANAME" >> $GITHUB_OUTPUT
          echo "CLEAN=$CLEAN" >> $GITHUB_OUTPUT
          echo "App: $ANAME"

      - name: Sign APK (generate key)
        if: inputs.signing_mode == 'generate'
        run: |
          SRC="workspace/${{ steps.detect.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          KS="$RUNNER_TEMP/sign.jks"
          PW="nova_$(head /dev/urandom | tr -dc a-zA-Z0-9 | head -c 24)"
          keytool -genkeypair -v \
            -keystore "$KS" -alias nova \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Nova,OU=Build,O=Nova,L=Unknown,ST=Unknown,C=US"
          T="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)"
          "$T/zipalign" -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$PW" \
            --ks-key-alias nova --key-pass "pass:$PW" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" "$SRC"
          printf "storeFile=signing.jks\nstorePassword=%s\nkeyAlias=nova\nkeyPassword=%s\n" "$PW" "$PW" > "$RUNNER_TEMP/keystore.txt"

      - name: Sign APK (existing key)
        if: inputs.signing_mode == 'existing'
        run: |
          SRC="workspace/${{ steps.detect.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/existing.jks"
          KS_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          K_ALIAS="${{ secrets.KEY_ALIAS }}"
          K_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$KS_PASS" ] || [ -z "$K_ALIAS" ] && echo "ERROR: Signing secrets missing" && exit 1
          T="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | tail -1)"
          "$T/zipalign" -f 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" sign \
            --ks "$RUNNER_TEMP/existing.jks" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --key-pass "pass:${K_PASS:-$KS_PASS}" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$T/apksigner" verify "$RUNNER_TEMP/signed.apk"
          cp "$RUNNER_TEMP/signed.apk" "$SRC"

      - name: Upload APK to release
        run: |
          SRC="workspace/${{ steps.detect.outputs.ROOT }}/${{ steps.apk.outputs.PATH }}"
          RID="${{ inputs.release_id }}"
          FNAME="${{ steps.app.outputs.CLEAN }}.apk"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$SRC" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=$FNAME"

      - name: Upload signing key
        if: inputs.signing_mode == 'generate'
        run: |
          RID="${{ inputs.release_id }}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/sign.jks" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=signing.jks"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@$RUNNER_TEMP/keystore.txt" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RID/assets?name=keystore-properties.txt"

      - name: Publish release
        run: |
          RID="${{ inputs.release_id }}"
          ANAME="${{ steps.app.outputs.NAME }}"
          ASIZE="${{ steps.apk.outputs.SIZE }}"
          ATYPE="${{ steps.detect.outputs.TYPE }}"
          SMODE="${{ inputs.signing_mode }}"
          BF="$RUNNER_TEMP/body.txt"
          EXTRA_LINE=""
          [ "$SMODE" = "generate" ] && EXTRA_LINE=". Save the signing key for future updates."
          {
            echo "APK build succeeded."
            echo ""
            echo "- App: $ANAME"
            echo "- APK: ${{ steps.app.outputs.CLEAN }}.apk ($ASIZE bytes)"
            echo "- Type: $ATYPE"
            echo "- Signing: $SMODE"
            [ -n "$EXTRA_LINE" ] && echo ""
            [ -n "$EXTRA_LINE" ] && echo "$EXTRA_LINE"
          } > "$BF"
          BJSON=$(jq -Rs '.' "$BF")
          NJSON=$(printf '%s' "$ANAME" | jq -Rs '.')
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":$NJSON,\"body\":$BJSON,\"draft\":false}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/$RID"

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ${{ steps.app.outputs.NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.detect.outputs.TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ steps.app.outputs.CLEAN }}.apk (${{ steps.apk.outputs.SIZE }} bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: ${{ inputs.signing_mode }}" >> $GITHUB_STEP_SUMMARY
