name: Build APK
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "GitHub Release ID for output"
        required: true
        type: string
      blob_sha:
        description: "Git blob SHA containing the source ZIP"
        required: true
        type: string
      signing_mode:
        description: "Signing mode: generate or existing"
        required: true
        type: string
        default: generate

permissions:
  contents: write
  actions: read
env:
  JAVA_DIST: temurin
  JAVA_VERSION: "17"
jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download source ZIP from blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Download source ZIP from blob"
          BLOB_SHA="${{ inputs.blob_sha }}"
          echo "Blob SHA: $BLOB_SHA"
          if command -v gh &>/dev/null; then
            echo "Downloading via gh api..."
            if gh api "repos/${{ github.repository }}/git/blobs/$BLOB_SHA" \
              -H "Accept: application/vnd.github.v3.raw" > source.zip 2>&1; then
              echo "gh api download succeeded"
            else
              echo "gh api failed, trying curl..."
              rm -f source.zip
            fi
          fi
          if [ ! -f source.zip ] || [ ! -s source.zip ]; then
            echo "Downloading via curl..."
            curl -sfL -o source.zip \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3.raw" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" || true
          fi
          if [ ! -f source.zip ] || [ ! -s source.zip ]; then
            echo "Trying JSON base64 decode..."
            B64=$(curl -sf -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "${{ github.api_url }}/repos/${{ github.repository }}/git/blobs/$BLOB_SHA" | jq -r .content)
            echo "$B64" | base64 -d > source.zip
          fi
          ZIP_SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          echo "ZIP size: $ZIP_SIZE bytes"
          if [ "$ZIP_SIZE" -lt 100 ]; then
            echo "ERROR: ZIP too small or empty"
            file source.zip
            head -c 200 source.zip
            exit 1
          fi
          if [ "$ZIP_SIZE" -gt 524288000 ]; then
            echo "ERROR: ZIP exceeds 500 MB"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validate ZIP file
        run: |
          echo "::group::Validate ZIP"
          if ! file source.zip | grep -q "Zip archive"; then
            echo "ERROR: Not a valid ZIP file"
            exit 1
          fi
          if unzip -l source.zip | grep -qE "\.\.\\\\.\\."; then
            echo "ERROR: Path traversal detected"
            exit 1
          fi
          ENTRY_COUNT=$(unzip -l source.zip | tail -1 | awk "{print \\$2}")
          ENTRY_COUNT=${ENTRY_COUNT:-0}
          if [ "$ENTRY_COUNT" -gt 50000 ]; then
            echo "ERROR: Too many entries ($ENTRY_COUNT)"
            exit 1
          fi
          echo "Entries: $ENTRY_COUNT"
          echo "::endgroup::"

      - name: Extract ZIP safely
        run: |
          echo "::group::Extract ZIP"
          mkdir -p workspace
          cd workspace
          unzip -o ../source.zip
          cd ..
          find workspace -maxdepth 3 -type f | head -40
          echo "::endgroup::"

      - name: Detect project type
        id: detect
        run: |
          cd workspace
          PROJECT_ROOT=""
          PROJECT_TYPE=""
          is_flutter() { [ -f "$1/pubspec.yaml" ] && grep -q "flutter:" "$1/pubspec.yaml" 2>/dev/null; }
          is_android() { [ -f "$1/settings.gradle" ] || [ -f "$1/settings.gradle.kts" ] || ([ -f "$1/build.gradle" ] && [ -d "$1/app" ]); }
          if is_flutter .; then PROJECT_ROOT="."; PROJECT_TYPE="flutter"
          elif is_android .; then PROJECT_ROOT="."; PROJECT_TYPE="android"
          else
            for dir in */; do d="${dir%/}"; [ -d "$d" ] || continue
              if [ -z "$PROJECT_ROOT" ] && is_flutter "$d"; then PROJECT_ROOT="$d"; PROJECT_TYPE="flutter"
              elif [ -z "$PROJECT_ROOT" ] && is_android "$d"; then PROJECT_ROOT="$d"; PROJECT_TYPE="android"; fi
            done
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            for dir in */*/; do d="${dir%/}"; [ -d "$d" ] || continue
              if [ -z "$PROJECT_ROOT" ] && is_flutter "$d"; then PROJECT_ROOT="$d"; PROJECT_TYPE="flutter"
              elif [ -z "$PROJECT_ROOT" ] && is_android "$d"; then PROJECT_ROOT="$d"; PROJECT_TYPE="android"; fi
            done
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: No Android or Flutter project found"
            find . -maxdepth 3 -type f | head -30
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo "Detected: $PROJECT_TYPE at $PROJECT_ROOT"

      - name: Setup Java
        if: steps.detect.outputs.PROJECT_TYPE == android
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        if: steps.detect.outputs.PROJECT_TYPE == flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Setup Java for Flutter
        if: steps.detect.outputs.PROJECT_TYPE == flutter
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        if: steps.detect.outputs.PROJECT_TYPE == android || steps.detect.outputs.PROJECT_TYPE == flutter
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: steps.detect.outputs.PROJECT_TYPE == android
        shell: bash
        run: |
          set -o pipefail
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}
          chmod +x gradlew 2>/dev/null || true
          BUILD_SUCCEEDED=false
          BUILD_LOG="$RUNNER_TEMP/build.log"
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            if ./gradlew assembleRelease --no-daemon --stacktrace > "$BUILD_LOG" 2>&1; then
              BUILD_SUCCEEDED=true
            else
              echo "Gradle wrapper failed, trying fallback..."
              tail -40 "$BUILD_LOG"
            fi
          fi
          if [ "$BUILD_SUCCEEDED" = false ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip
            export PATH="$PWD/gradle-8.4/bin:$PATH"
            set +e
            gradle assembleRelease --no-daemon --stacktrace > "$BUILD_LOG" 2>&1
            BUILD_EXIT=$?
            set -e
          fi
          tail -60 "$BUILD_LOG"
          if [ "$BUILD_SUCCEEDED" = false ] && [ "${BUILD_EXIT:-0}" -ne 0 ]; then
            echo "ERROR: Gradle build failed"
            exit 1
          fi
          find . -name "*.apk" 2>/dev/null

      - name: Build Flutter APK
        if: steps.detect.outputs.PROJECT_TYPE == flutter
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false"
        run: |
          set -o pipefail
          echo "::group::Build Flutter APK"
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}

          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            CURRENT_VER=$(grep "distributionUrl" "$GRADLE_PROP" | grep -o "[0-9]+\\.[0-9]+" | head -1 || true)
            echo "Gradle version: ${CURRENT_VER:-unknown}"
            MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
            if [ -n "$MAJOR" ] && [ -n "$MINOR" ]; then
              if [ "$MAJOR" -lt 8 ] || ([ "$MAJOR" -eq 8 ] && [ "$MINOR" -lt 10 ]); then
                echo "Upgrading Gradle to 8.10"
                sed -i "s|distributionUrl=.*|distributionUrl=https:\\\/\\/services.gradle.org/distributions/gradle-8.10-bin.zip|" "$GRADLE_PROP"
              fi
            fi
          fi

          APP_BUILD="android/app/build.gradle"
          if [ -f "$APP_BUILD" ]; then
            if grep -q "ndkVersion" "$APP_BUILD"; then
              echo "Removing hardcoded ndkVersion"
              sed -i "/^[[:space:]]*ndkVersion/d" "$APP_BUILD"
            fi
            sed -i "s|com.android.support:multidex|androidx.multidex:multidex|g" "$APP_BUILD"
          fi
          echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          echo "--- flutter pub get ---"
          flutter pub get 2>&1 | tail -20
          echo "--- end pub get ---"

          PUB_CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          PATCHED=0
          for F in $(grep -rl "flutter " "$PUB_CACHE/hosted" --include="*.gradle" 2>/dev/null); do
            echo "Patching: $F"
            sed -i "/^[[:space:]]*flutter[[:space:]]*{/,/}/d" "$F"
            PATCHED=$((PATCHED + 1))
          done
          echo "Patched $PATCHED files with flutter block"

          echo "--- flutter build apk --release ---"
          BUILD_LOG="$RUNNER_TEMP/flutter_build.log"
          set +e
          flutter build apk --release 2>&1 | tee "$BUILD_LOG"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          echo "--- exit code: $BUILD_EXIT ---"
          mkdir -p "$RUNNER_TEMP/build-artifacts"
          cp "$BUILD_LOG" "$RUNNER_TEMP/build-artifacts/build.log"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Flutter build failed"
            ERROR_FILE="$RUNNER_TEMP/build-error.txt"
            tail -80 "$BUILD_LOG" > "$ERROR_FILE"
            curl -sf -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: text/plain" \
              --data-binary "@$ERROR_FILE" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ inputs.release_id }}/assets?name=build-error.txt" || true
            exit 1
          fi
          echo "::group::Locate APK"
          find . -name "*.apk" 2>/dev/null
          echo "::endgroup::"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build-artifacts/


      - name: Locate APK
        id: locate
        run: |
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}
          APK_PATH=""
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" -print -quit 2>/dev/null)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*-release.apk" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -not -path "*test*" -not -path "*debug*" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Verify APK
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          if [ ! -f "$APK" ]; then echo "ERROR: APK not found"; exit 1; fi
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
          if [ "$APK_SIZE" -lt 10000 ]; then echo "ERROR: APK too small ($APK_SIZE bytes)"; exit 1; fi
          file "$APK"

      - name: Sign APK generate new key
        if: inputs.signing_mode == generate
        id: sign-generate
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          KEYSTORE_PATH="$RUNNER_TEMP/nova-signing.jks"
          KEYSTORE_PASS="nova_$(head /dev/urandom | tr -dc a-zA-Z0-9 | head -c 24)"
          KEY_PASS="$KEYSTORE_PASS"
          KEY_ALIAS="nova"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" \n            -keyalg RSA -keysize 2048 -validity 10000 \n            -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" \n            -dname "CN=Nova Builder, OU=Build, O=Nova, L=Unknown, ST=Unknown, C=US"
          BT="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/zipalign"
          "$BT" -v 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/apksigner"
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-pass "pass:$KEYSTORE_PASS" \n            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \n            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/signed.apk" 2>&1 | head -20
          cp "$RUNNER_TEMP/signed.apk" "$APK"
          printf "storeFile=nova-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \n            "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$RUNNER_TEMP/keystore-properties.txt"

      - name: Sign APK use existing key
        if: inputs.signing_mode == existing
        id: sign-existing
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/existing.jks"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Signing secrets not configured"
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/zipalign"
          "$BT" -v 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/existing.jks" --ks-pass "pass:$KEYSTORE_PASS" \n            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASS" \n            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "$RUNNER_TEMP/signed.apk" 2>&1 | head -20
          cp "$RUNNER_TEMP/signed.apk" "$APK"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          RELEASE_ID="${{ inputs.release_id }}"
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" --data-binary "@$APK" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=${{ steps.locate.outputs.APK_NAME }}"

      - name: Upload signing key
        if: inputs.signing_mode == generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ inputs.release_id }}"
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" --data-binary "@$RUNNER_TEMP/nova-signing.jks" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=nova-signing.jks"
          curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: text/plain" --data-binary "@$RUNNER_TEMP/keystore-properties.txt" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=keystore-properties.txt"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ inputs.release_id }}"
          SIGNING_MODE="${{ inputs.signing_mode }}"
          APK_NAME="${{ steps.locate.outputs.APK_NAME }}"
          APK_SIZE="${{ steps.locate.outputs.APK_SIZE }}"
          EXTRA_WARN=""
          if [ "$SIGNING_MODE" = "generate" ]; then
            EXTRA_WARN=". Save the signing key assets for future updates."
          fi
          curl -s -X PATCH -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg p "${{ steps.detect.outputs.PROJECT_TYPE }}" --arg a "$APK_NAME" --arg s "$APK_SIZE" --arg m "$SIGNING_MODE" --arg w "$EXTRA_WARN" '{"draft":false,"body":"APK build succeeded.\n\n- Project: " + $p + "\n- APK: " + $a + " (" + $s + " bytes)\n- Signing: " + $m + $w}')" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/$RELEASE_ID"

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.detect.outputs.PROJECT_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Root**: ${{ steps.detect.outputs.PROJECT_ROOT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ steps.locate.outputs.APK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ steps.locate.outputs.APK_SIZE }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: ${{ inputs.signing_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: #${{ inputs.release_id }}" >> $GITHUB_STEP_SUMMARY
