# Nova APK Builder - Build Workflow
# Triggered by the website via workflow_dispatch

name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'GitHub Release ID containing source ZIP'
        required: true
        type: string
      signing_mode:
        description: 'Signing mode: generate or existing'
        required: true
        type: string
        default: 'generate'

permissions:
  contents: write
  actions: read

env:
  JAVA_DIST: 'temurin'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download source ZIP from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Download source ZIP"
          RELEASE_ID="${{ inputs.release_id }}"
          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/$RELEASE_ID/assets")
          ZIP_URL=$(echo "$ASSETS" | jq -r '.[] | select(.name=="source.zip") | .url')
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "ERROR: source.zip not found in release assets"
            exit 1
          fi
          curl -L -o source.zip -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" "$ZIP_URL"
          ZIP_SIZE=$(stat -c%s source.zip 2>/dev/null || stat -f%z source.zip)
          echo "ZIP size: $ZIP_SIZE bytes"
          if [ "$ZIP_SIZE" -lt 100 ]; then
            echo "ERROR: ZIP file is too small or empty"
            exit 1
          fi
          if [ "$ZIP_SIZE" -gt 524288000 ]; then
            echo "ERROR: ZIP file exceeds 500 MB limit"
            exit 1
          fi
          echo "::endgroup::"

      - name: Validate ZIP file
        run: |
          echo "::group::Validate ZIP"
          if ! file source.zip | grep -q 'Zip archive'; then
            echo "ERROR: Not a valid ZIP file"
            exit 1
          fi
          if unzip -l source.zip | grep -qE '\.\./|\\\\\.\.'; then
            echo "ERROR: ZIP contains path traversal entries"
            exit 1
          fi
          ENTRY_COUNT=$(unzip -l source.zip | tail -1 | awk '{print $2}')
          ENTRY_COUNT=${ENTRY_COUNT:-0}
          if [ "$ENTRY_COUNT" -gt 50000 ]; then
            echo "ERROR: ZIP has too many entries ($ENTRY_COUNT). Possible zip bomb."
            exit 1
          fi
          echo "Entries: $ENTRY_COUNT"
          echo "::endgroup::"

      - name: Extract ZIP safely
        run: |
          echo "::group::Extract ZIP"
          mkdir -p workspace
          cd workspace
          unzip -o ../source.zip
          cd ..
          echo "Extracted contents:"
          find workspace -maxdepth 3 -type f | head -40
          echo "::endgroup::"

      - name: Detect project type
        id: detect
        run: |
          echo "::group::Detect project"
          cd workspace
          PROJECT_ROOT=""
          PROJECT_TYPE=""
          is_flutter() {
            local dir="$1"
            [ -f "$dir/pubspec.yaml" ] && grep -q 'flutter:' "$dir/pubspec.yaml" 2>/dev/null
          }
          is_android() {
            local dir="$1"
            [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ] || \
            ([ -f "$dir/build.gradle" ] && -d "$dir/app" ])
          }
          if is_flutter .; then
            PROJECT_ROOT="."
            PROJECT_TYPE="flutter"
          elif is_android .; then
            PROJECT_ROOT="."
            PROJECT_TYPE="android"
          else
            for dir in */; do
              [ -d "$dir" ] || continue
              dir="${dir%/}"
              if [ -z "$PROJECT_ROOT" ] && is_flutter "$dir"; then
                PROJECT_ROOT="$dir"
                PROJECT_TYPE="flutter"
              elif [ -z "$PROJECT_ROOT" ] && is_android "$dir"; then
                PROJECT_ROOT="$dir"
                PROJECT_TYPE="android"
              fi
            done
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            for dir in */*/; do
              [ -d "$dir" ] || continue
              dir="${dir%/}"
              if [ -z "$PROJECT_ROOT" ] && is_flutter "$dir"; then
                PROJECT_ROOT="$dir"
                PROJECT_TYPE="flutter"
              elif [ -z "$PROJECT_ROOT" ] && is_android "$dir"; then
                PROJECT_ROOT="$dir"
                PROJECT_TYPE="android"
              fi
            done
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: No Android or Flutter project found in ZIP"
            echo "Contents:"
            find . -maxdepth 3 -type f | head -30
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_OUTPUT
          echo "PROJECT_TYPE=$PROJECT_TYPE" >> $GITHUB_OUTPUT
          echo "Detected: $PROJECT_TYPE at $PROJECT_ROOT"
          echo "::endgroup::"

      - name: Setup Java
        if: steps.detect.outputs.PROJECT_TYPE == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        if: steps.detect.outputs.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Setup Java for Flutter
        if: steps.detect.outputs.PROJECT_TYPE == 'flutter'
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        if: steps.detect.outputs.PROJECT_TYPE == 'android'
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        if: steps.detect.outputs.PROJECT_TYPE == 'android'
        shell: bash
        run: |
          set -o pipefail
          echo "::group::Build Android APK"
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}
          chmod +x gradlew 2>/dev/null || true
          BUILD_SUCCEEDED=false
          BUILD_LOG="$RUNNER_TEMP/build.log"
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Using project Gradle wrapper"
            if ./gradlew assembleRelease --no-daemon --stacktrace > "$BUILD_LOG" 2>&1; then
              BUILD_SUCCEEDED=true
            else
              echo "Gradle wrapper failed, trying fallback..."
              echo "--- Wrapper error (last 40 lines) ---"
              tail -40 "$BUILD_LOG"
            fi
          fi
          if [ "$BUILD_SUCCEEDED" = "false" ]; then
            echo "Installing Gradle 8.4 directly"
            wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
            unzip -q gradle-8.4-bin.zip
            export PATH="$PWD/gradle-8.4/bin:$PATH"
            set +e
            gradle assembleRelease --no-daemon --stacktrace > "$BUILD_LOG" 2>&1
            BUILD_EXIT=$?
            set -e
          fi
          echo "--- Build output (last 60 lines) ---"
          tail -60 "$BUILD_LOG"
          if [ "$BUILD_SUCCEEDED" = "false" ] && [ "${BUILD_EXIT:-0}" -ne 0 ]; then
            echo "ERROR: Gradle build failed (exit code $BUILD_EXIT)"
            exit 1
          fi
          echo "::endgroup::"
          echo "::group::Locate APK"
          find . -name "*.apk" 2>/dev/null
          echo "::endgroup::"

      - name: Build Flutter APK
        if: steps.detect.outputs.PROJECT_TYPE == 'flutter'
        shell: bash
        run: |
          set -o pipefail
          echo "::group::Build Flutter APK"
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}
          flutter pub get 2>&1 | tail -20
          # Auto-fix Gradle wrapper version if needed
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            CURRENT_VER=$(grep 'distributionUrl' "$GRADLE_PROP" | grep -oP '\d+\.\d+(?=\.\d+-bin)')
            echo "Current Gradle version: ${CURRENT_VER:-unknown}"
            if [ -n "$CURRENT_VER" ]; then
              MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
              MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
              if [ "$MAJOR" -lt 8 ] || ([ "$MAJOR" -eq 8 ] && [ "$MINOR" -lt 14 ]); then
                echo "Upgrading Gradle from $CURRENT_VER to 8.14"
                sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-bin.zip|' "$GRADLE_PROP"
                cat "$GRADLE_PROP"
              fi
            fi
          fi
          flutter build apk --release 2>&1 | tail -40
          echo "::endgroup::"
          echo "::group::Locate APK"
          find . -name "*.apk" 2>/dev/null
          echo "::endgroup::"

      - name: Locate APK
        id: locate
        run: |
          cd workspace/${{ steps.detect.outputs.PROJECT_ROOT }}
          APK_PATH=""
          APK_PATH=$(find . -name "*.apk" -path "*/release/*" -print -quit 2>/dev/null)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*-release.apk" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -not -path "*test*" -not -path "*debug*" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -print -quit 2>/dev/null)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK was generated by the build"
            exit 1
          fi
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_NAME=$APK_NAME" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH ($APK_SIZE bytes)"

      - name: Verify APK
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found at $APK"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK" 2>/dev/null || stat -f%z "$APK")
          if [ "$APK_SIZE" -lt 10000 ]; then
            echo "ERROR: APK is suspiciously small ($APK_SIZE bytes)"
            exit 1
          fi
          file "$APK"
          echo "APK verified: $APK_NAME ($APK_SIZE bytes)"

      - name: Sign APK (generate new key)
        if: inputs.signing_mode == 'generate'
        id: sign-generate
        run: |
          echo "::group::Generate signing key and sign APK"
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          KEYSTORE_PATH="$RUNNER_TEMP/nova-signing.jks"
          KEYSTORE_PASS="nova_$(head /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 24)"
          KEY_PASS="$KEYSTORE_PASS"
          KEY_ALIAS="nova"
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Nova Builder, OU=Build, O=Nova, L=Unknown, ST=Unknown, C=US"
          ZIPALIGN="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/zipalign"
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          "$ZIPALIGN" -v 4 "$APK" "$ALIGNED_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/apksigner"
          SIGNED_APK="$RUNNER_TEMP/signed.apk"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK" 2>&1 | head -20
          cp "$SIGNED_APK" "$APK"
          printf 'storeFile=nova-signing.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > "$RUNNER_TEMP/keystore-properties.txt"
          echo "APK signed successfully with new key"
          echo "::endgroup::"

      - name: Sign APK (use existing key)
        if: inputs.signing_mode == 'existing'
        id: sign-existing
        run: |
          echo "::group::Sign APK with existing key"
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/existing.jks"
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Signing secrets not configured."
            echo "Go to repo Settings > Secrets and variables > Actions"
            echo "Add: SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS"
            exit 1
          fi
          ZIPALIGN="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/zipalign"
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          "$ZIPALIGN" -v 4 "$APK" "$ALIGNED_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/"$(ls "$ANDROID_HOME/build-tools/" | tail -1)"/apksigner"
          SIGNED_APK="$RUNNER_TEMP/signed.apk"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/existing.jks" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose "$SIGNED_APK" 2>&1 | head -20
          cp "$SIGNED_APK" "$APK"
          echo "APK signed with existing key"
          echo "::endgroup::"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="workspace/${{ steps.detect.outputs.PROJECT_ROOT }}/${{ steps.locate.outputs.APK_PATH }}"
          RELEASE_ID="${{ inputs.release_id }}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$APK" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=${{ steps.locate.outputs.APK_NAME }}"
          echo "APK uploaded"

      - name: Upload signing key (generate mode)
        if: inputs.signing_mode == 'generate'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ inputs.release_id }}"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$RUNNER_TEMP/nova-signing.jks" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=nova-signing.jks"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: text/plain" \
            --data-binary "@$RUNNER_TEMP/keystore-properties.txt" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=keystore-properties.txt"
          echo "Signing key uploaded"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID="${{ inputs.release_id }}"
          SIGNING_MODE="${{ inputs.signing_mode }}"
          APK_NAME="${{ steps.locate.outputs.APK_NAME }}"
          APK_SIZE="${{ steps.locate.outputs.APK_SIZE }}"
          EXTRA_WARN=""
          if [ "$SIGNING_MODE" = "generate" ]; then
            EXTRA_WARN=". Save the signing key assets (nova-signing.jks and keystore-properties.txt) for future app updates."
          fi
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg p "${{ steps.detect.outputs.PROJECT_TYPE }}" \
              --arg a "$APK_NAME" \
              --arg s "$APK_SIZE" \
              --arg m "$SIGNING_MODE" \
              --arg w "$EXTRA_WARN" \
              '{draft:false, body: ("APK build succeeded.\n\n- Project: " + $p + "\n- APK: " + $a + " (" + $s + " bytes)\n- Signing: " + $m + $w)}')" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/$RELEASE_ID"
          echo "Release published"

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Project Type**: ${{ steps.detect.outputs.PROJECT_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project Root**: ${{ steps.detect.outputs.PROJECT_ROOT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK**: ${{ steps.locate.outputs.APK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: ${{ steps.locate.outputs.APK_SIZE }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing**: ${{ inputs.signing_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: #${{ inputs.release_id }}" >> $GITHUB_STEP_SUMMARY
